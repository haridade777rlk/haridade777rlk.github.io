<style>
:root{
--bg-base:#07090e;--bg-surface:#0f141d;--bg-card:#141b26;--bg-card-hover:#1c2533;
--border-subtle:#212c3d;--text-main:#f8fafc;--text-muted:#94a3b8;
--neon-indigo:#6366f1;--neon-purple:#a855f7;--neon-cyan:#06b6d4;--neon-emerald:#10b981;--neon-amber:#f59e0b;
--radius-sm:10px;--radius-md:18px;--radius-lg:28px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg-base);color:var(--text-main);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.55;overflow-x:hidden;padding-bottom:84px;
background-image:radial-gradient(circle at 15% -5%,color-mix(in srgb,var(--neon-indigo) 22%,transparent),transparent 45%),radial-gradient(circle at 100% 10%,color-mix(in srgb,var(--neon-purple) 14%,transparent),transparent 40%);background-repeat:no-repeat}
a{color:inherit;text-decoration:none}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}
section{margin-top:32px}
h2{font-size:1.25rem;font-weight:700;margin-bottom:14px;letter-spacing:-.01em}
.muted{color:var(--text-muted)}

/* LONY shine + glow */
.lony{font-weight:800;letter-spacing:.05em;background:linear-gradient(110deg,var(--neon-indigo),var(--neon-cyan),var(--text-main),var(--neon-purple),var(--neon-indigo));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:lonyshine 3s linear infinite,lonyglow 2.4s ease-in-out infinite alternate}
@keyframes lonyshine{to{background-position:200% center}}
@keyframes lonyglow{from{filter:drop-shadow(0 0 3px color-mix(in srgb,var(--neon-cyan) 60%,transparent)) drop-shadow(0 0 8px color-mix(in srgb,var(--neon-indigo) 50%,transparent))}to{filter:drop-shadow(0 0 7px color-mix(in srgb,var(--neon-cyan) 90%,transparent)) drop-shadow(0 0 18px color-mix(in srgb,var(--neon-purple) 80%,transparent))}}
@media(prefers-reduced-motion:reduce){.lony{animation:none;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--neon-cyan) 70%,transparent))}}

/* Navbar */
.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg-base) 85%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--border-subtle)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:58px;gap:10px}
.logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.02rem;white-space:nowrap}
.logo b{display:grid;place-items:center;width:34px;height:34px;border-radius:var(--radius-sm);background:linear-gradient(135deg,var(--neon-indigo),var(--neon-purple));box-shadow:0 0 18px color-mix(in srgb,var(--neon-indigo) 55%,transparent);font-size:.95rem}
.back{font-size:.85rem;color:var(--text-muted);padding:8px 12px;border:1px solid var(--border-subtle);border-radius:999px;background:var(--bg-surface);transition:.25s}
.back:hover{color:var(--text-main);border-color:var(--neon-indigo);box-shadow:0 0 14px color-mix(in srgb,var(--neon-indigo) 40%,transparent)}

/* Hero */
.hero{margin-top:22px;padding:22px 18px;border-radius:var(--radius-lg);background:linear-gradient(160deg,var(--bg-card),var(--bg-surface));border:1px solid var(--border-subtle);box-shadow:0 0 50px color-mix(in srgb,var(--neon-indigo) 14%,transparent);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:180px;height:180px;border-radius:50%;background:color-mix(in srgb,var(--neon-cyan) 20%,transparent);filter:blur(50px);pointer-events:none}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;position:relative}
.badge{font-size:.78rem;font-weight:600;padding:5px 12px;border-radius:999px;border:1px solid}
.b-dept{color:var(--neon-cyan);border-color:color-mix(in srgb,var(--neon-cyan) 50%,transparent);background:color-mix(in srgb,var(--neon-cyan) 12%,transparent)}
.b-level{color:var(--neon-amber);border-color:color-mix(in srgb,var(--neon-amber) 50%,transparent);background:color-mix(in srgb,var(--neon-amber) 12%,transparent)}
h1{font-size:1.75rem;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin-bottom:10px;position:relative;overflow-wrap:anywhere}
.hero p{color:var(--text-muted);font-size:.95rem;margin-bottom:18px;position:relative}
.price-row{display:flex;align-items:baseline;gap:10px;margin-bottom:16px;position:relative}
.price{font-size:2.1rem;font-weight:800;color:var(--neon-emerald);text-shadow:0 0 20px color-mix(in srgb,var(--neon-emerald) 50%,transparent)}
.cta{display:flex;flex-direction:column;gap:10px;position:relative}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-md);font-weight:700;transition:.25s;text-align:center}
.btn-buy{padding:17px 20px;font-size:1.08rem;color:var(--text-main);background:linear-gradient(135deg,var(--neon-indigo),var(--neon-purple));box-shadow:0 0 28px color-mix(in srgb,var(--neon-purple) 45%,transparent)}
.btn-buy:hover{transform:translateY(-2px);box-shadow:0 0 42px color-mix(in srgb,var(--neon-purple) 65%,transparent)}
.btn-free{padding:11px 18px;font-size:.88rem;color:var(--neon-cyan);border:1px solid color-mix(in srgb,var(--neon-cyan) 50%,transparent);background:transparent}
.btn-free:hover{background:color-mix(in srgb,var(--neon-cyan) 12%,transparent);transform:translateY(-2px)}

/* Cards base */
.card{background:var(--bg-card);border:1px solid var(--border-subtle);border-radius:var(--radius-md);transition:.25s}
.card:hover{background:var(--bg-card-hover);border-color:color-mix(in srgb,var(--neon-indigo) 60%,var(--border-subtle));box-shadow:0 0 22px color-mix(in srgb,var(--neon-indigo) 22%,transparent)}

/* Quick info */
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick .card{padding:14px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.quick .ico{font-size:1.25rem}
.quick small{color:var(--text-muted);font-size:.75rem}
.quick strong{font-size:.98rem}

/* Learn */
.learn{list-style:none;display:grid;gap:10px}
.learn li{display:flex;gap:12px;align-items:flex-start;padding:13px 14px;font-size:.93rem}
.learn .i{flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:var(--radius-sm);background:color-mix(in srgb,var(--neon-indigo) 18%,transparent);font-size:1.1rem}

/* Components */
.comps{display:grid;gap:10px}
.comp{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 14px;align-items:center}
.comp .n{font-weight:600;font-size:.94rem;min-width:0;overflow-wrap:anywhere}
.comp .p{color:var(--neon-amber);font-weight:700;text-align:right}
.comp .q{color:var(--text-muted);font-size:.8rem}
.comp .pa{color:var(--text-muted);font-size:.72rem;text-align:right}

/* Steps */
.steps{display:grid;gap:10px}
.step{display:flex;gap:12px;padding:14px}
.num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem;background:linear-gradient(135deg,var(--neon-indigo),var(--neon-purple));box-shadow:0 0 14px color-mix(in srgb,var(--neon-indigo) 50%,transparent)}
.step h3{font-size:.98rem;margin-bottom:3px}
.step p{font-size:.86rem;color:var(--text-muted)}
.step .tx{min-width:0}
.step.lock{opacity:.8}
.step.lock .num{background:var(--bg-surface);border:1px solid var(--border-subtle);box-shadow:none;font-size:1rem}
.step.lock p{filter:blur(4px);user-select:none}
.tag{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:999px;margin-left:6px;vertical-align:middle}
.t-open{color:var(--neon-emerald);background:color-mix(in srgb,var(--neon-emerald) 14%,transparent)}
.t-lock{color:var(--neon-amber);background:color-mix(in srgb,var(--neon-amber) 14%,transparent)}

/* Included */
.inc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.inc .card{padding:14px 12px;display:flex;gap:10px;align-items:center;min-width:0;font-size:.9rem;font-weight:600}
.inc .tick{flex:none;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;color:var(--bg-base);background:var(--neon-emerald);box-shadow:0 0 12px color-mix(in srgb,var(--neon-emerald) 55%,transparent)}

/* Viva */
.viva{display:grid;gap:10px}
.q{padding:14px;font-size:.92rem}
.q span{display:block;color:var(--neon-cyan);font-size:.76rem;font-weight:700;margin-bottom:3px}
.q.lock{display:flex;justify-content:space-between;align-items:center;gap:10px;color:var(--text-muted)}
.q.lock div{filter:blur(3.5px);user-select:none;min-width:0}
.q.lock i{font-style:normal;font-size:1.1rem;flex:none}

/* Related */
.rel{display:grid;gap:10px}
.rel a{padding:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.rel b{display:block;font-size:.94rem;margin-bottom:4px}
.rel small{color:var(--text-muted)}
.rel em{font-style:normal;font-weight:700;color:var(--neon-emerald);flex:none}
.rel .l{min-width:0}

/* Departments */
.deps{display:grid;grid-template-columns:1fr;gap:10px}
.dep{padding:14px;display:block;min-width:0}
.dep header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.dep h3{font-size:1rem}
.dep .f{font-size:.68rem;font-weight:700;padding:2px 9px;border-radius:999px;color:var(--neon-emerald);background:color-mix(in srgb,var(--neon-emerald) 14%,transparent);white-space:nowrap}
.dep ul{list-style:none;display:grid;gap:5px}
.dep li{font-size:.84rem;color:var(--text-muted);padding-left:16px;position:relative;overflow-wrap:anywhere}
.dep li::before{content:"";position:absolute;left:2px;top:.55em;width:6px;height:6px;border-radius:50%;background:var(--neon-cyan);box-shadow:0 0 8px var(--neon-cyan)}
.dep h3{margin-bottom:10px}
.dep h4{font-size:.74rem;font-weight:700;margin:10px 0 6px}
.dep h4.free{color:var(--neon-emerald)}
.dep h4.paid{color:var(--neon-amber)}
.dep .pl li{display:flex;justify-content:space-between;gap:8px;padding-left:0}
.dep .pl li::before{display:none}
.dep .pl b{flex:none;color:var(--neon-amber);font-size:.78rem}
.dep .pd{margin-top:10px}
.dep summary{cursor:pointer;list-style:none;font-size:.8rem;font-weight:700;color:var(--neon-amber);padding:9px 12px;border-radius:var(--radius-sm);border:1px solid color-mix(in srgb,var(--neon-amber) 45%,transparent);background:color-mix(in srgb,var(--neon-amber) 10%,transparent);display:flex;justify-content:space-between;transition:.25s}
.dep summary::-webkit-details-marker{display:none}
.dep summary::after{content:"▾"}
.dep .pd[open] summary::after{content:"▴"}
.dep .pd .pl{margin-top:10px}
@media(min-width:600px){.deps{grid-template-columns:1fr 1fr}}
@media(min-width:769px){.deps{grid-template-columns:repeat(4,1fr)}}

/* Footer */
footer{margin-top:40px;padding:26px 0;border-top:1px solid var(--border-subtle);background:var(--bg-surface);text-align:center;font-size:.82rem;color:var(--text-muted)}
footer strong{color:var(--text-main)}
footer p+p{margin-top:6px}

/* Sticky bar */
.bar{display:none}
@media(max-width:768px){
.bar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--bg-surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--border-subtle);box-shadow:0 -8px 30px color-mix(in srgb,var(--neon-indigo) 18%,transparent)}
.bar small{display:block;color:var(--text-muted);font-size:.7rem;line-height:1.1}
.bar strong{font-size:1.3rem;color:var(--neon-emerald)}
.bar .btn{padding:13px 26px;font-size:.98rem;background:linear-gradient(135deg,var(--neon-indigo),var(--neon-purple));box-shadow:0 0 22px color-mix(in srgb,var(--neon-purple) 45%,transparent)}
}
@media(min-width:600px){
.wrap{padding:0 24px}
h1{font-size:2.3rem}
.hero{padding:34px 32px}
.cta{flex-direction:row;align-items:center}
.btn-buy{padding:17px 34px}
.quick{grid-template-columns:repeat(4,1fr)}
.comps,.rel{grid-template-columns:1fr 1fr}
.inc{grid-template-columns:repeat(3,1fr)}
.rel{grid-template-columns:repeat(3,1fr)}
.rel a{flex-direction:column;align-items:flex-start}
}
@media(min-width:769px){body{padding-bottom:0}}
</style>
